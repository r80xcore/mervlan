<!DOCTYPE html>
<html>
<head>
    <!-- view_logs.html version="0.47" -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MerVLAN Log Viewer</title>
  <style>
    html,
    body {
        height: 100%;
    }

    body { 
        background: #1E1E1E; 
        color: #DADADA; 
        font-family: Tahoma, Arial, sans-serif; 
        margin: 0;
        padding: 15px;
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    .header { 
        text-align: center; 
        margin-bottom: 15px; 
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
        flex: 0 0 auto;
    }
    
    h1 { 
        color: #FFFFFF; 
        margin: 0;
        font-size: 18px;
    }
    
    .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding: 10px;
        background: #2D2D30;
        border-radius: 4px;
        height: 50px;
        box-sizing: border-box;
        flex: 0 0 auto;
    }
    
    .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 30px;
    }
    
    .control-item {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 100%;
    }
    
    .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 10px;
        border-bottom: 1px solid #444;
        flex: 0 0 auto;
    }
    
    .tab {
        padding: 8px 16px;
        background: #2D2D30;
        border: 1px solid #444;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        cursor: pointer;
        margin-right: 0;
        transition: background-color 0.2s;
    }
    
    .tab.active {
        background: #4A90E2;
        color: white;
    }
    
    .tab:hover {
        background: #357ABD;
    }

    .worker-select {
        display: none;
        margin: 0 0 10px 0;
        width: 100%;
        flex: 0 0 auto;
    }
    
    select, button {
        background: #4A90E2;
        border: 1px solid #555;
        color: #fff;
        height: 25px;
        font-size: 14px;
        padding: 0 10px;
        border-radius: 4px;
        cursor: pointer;
        box-sizing: border-box;
        transition: background-color 0.2s;
    }
    
    select:hover, button:hover {
        background: #357ABD;
    }
    
    input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        vertical-align: middle;
    }
    
    label {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 25px;
        margin: 0;
        font-size: 14px;
    }
    
    .danger { 
        background: #E74C3C; 
    }
    
    .danger:hover { 
        background: #C0392B; 
    }
    
    .log-container {
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
    }
    
    .log-content {
        background: #000;
        color: #DADADA;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
        padding: 10px;
        overflow: auto;
        flex-grow: 1;
        border-radius: 0 0 8px 8px;
        user-select: text;
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        
        /* Scrollbar styling to match index.html */
        scrollbar-width: thin;
        scrollbar-color: #569AC7 #1F2D35;
    }
    
    .log-content::-webkit-scrollbar { 
        width: 10px; 
        height: 10px; 
    }
    
    .log-content::-webkit-scrollbar-track { 
        background: #1F2D35;
    }
    
    .log-content::-webkit-scrollbar-thumb { 
        background: #569AC7;
        border-radius: 8px; 
        border: 2px solid #1F2D35;
    }
    
    .log-content::-webkit-scrollbar-thumb:hover { 
        background: #77A5C6;
    }
    
    .log-content::-webkit-scrollbar-corner { 
        background: #1F2D35;
    }
    
    .status {
        margin-left: 10px;
        font-size: 12px;
        color: #DADADA;
        height: 25px;
        display: flex;
        align-items: center;
    }
    
    .selection-mode {
        background: #4A90E2;
        padding: 2px 8px;
        border-radius: 3px;
        font-size: 11px;
        margin-left: 10px;
    }

    @media (max-width: 720px) {
        html,
        body {
            height: auto;
            min-height: 100%;
        }

        body {
            padding: 10px;
            min-height: 100dvh;
            overflow: auto;
        }

        .controls {
            height: auto;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
        }

        .control-group {
            height: auto;
            flex-wrap: wrap;
        }

        .log-container {
            flex: 0 0 auto;
            height: 55vh;
            height: 55dvh;
            min-height: 260px;
        }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MerVLAN Log Viewer</h1>
  </div>
  
  <div class="controls">
    <div class="control-group">
      <div class="control-item">
        <label>
          <input type="checkbox" id="autoScroll" checked> Auto-scroll
        </label>
      </div>
      <div class="control-item">
        <label>Refresh rate:
          <select id="refreshRate">
            <option value="1500">1.5s</option>
            <option value="3000" selected>3s</option>
            <option value="5000">5s</option>
            <option value="7500">7.5s</option>
            <option value="10000">10s</option>
            <option value="30000">30s</option>
            <option value="60000">1m</option>
          </select>
        </label>
      </div>
      <div class="control-item">
        <span id="lastUpdate" class="status">Last update: Never</span>
        <span id="selectionStatus" class="selection-mode" style="display: none;">Selection Mode - Auto-refresh paused</span>
      </div>
    </div>
    <div class="control-group">
      <button onclick="refreshLogs()">Refresh Now</button>
      <button class="danger" onclick="window.close()">Close</button>
    </div>
  </div>
  
  <div class="tabs">
    <div class="tab active" data-log="vlanmgr">VLAN Manager</div>
    <div class="tab" data-log="cli">CLI Output</div>
    <div class="tab" data-log="boot">Boot &amp; Startup</div>
    <div class="tab" data-log="worker">Node worker logs</div>
  </div>
  <select id="workerLog" class="worker-select" aria-label="Node worker log"></select>
  
  <div class="log-container">
    <div class="log-content" id="logContent">
Loading log content...
    </div>
  </div>

  <script>
    // Access logs via symlinked tmp directory
    const LOG_PATHS = {
        vlanmgr: "tmp/logs/vlan_manager.json",
        cli: "tmp/logs/cli_output.json",
        boot: "tmp/logs/boot_wrap.json",
        workerIndex: "tmp/logs/node_workers/index.json"
    };
    
    let currentLog = 'vlanmgr';
    let refreshInterval = null;
    let autoScroll = true;
    let lastContent = '';
    let isTabSwitching = false;
    let isUserSelecting = false;
    let mouseDownTimeout = null;
    let workerLogs = [];
    let workerIndexLoaded = false;

    async function loadWorkerIndex() {
        const response = await fetch(LOG_PATHS.workerIndex, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data || data.format_version !== 1 || !Array.isArray(data.jobs)) {
            throw new Error('Invalid worker log index');
        }
        workerLogs = data.jobs.filter(item =>
            item && item.phase === 'sync' && typeof item.node_id === 'string' &&
            typeof item.state === 'string' && typeof item.cli === 'string' && typeof item.vlan === 'string' && typeof item.stdout === 'string' &&
            ['running', 'ok', 'failed', 'timeout'].includes(item.state) &&
            [item.cli, item.vlan, item.stdout].every(path => /^[A-Za-z0-9._/-]+\.json$/.test(path) && !path.includes('..'))
        );
        const select = document.getElementById('workerLog');
        const previous = select.value;
        select.textContent = '';
        workerLogs.forEach((item, index) => {
            ['cli', 'vlan', 'stdout'].forEach(channel => {
                const option = document.createElement('option');
                option.value = item[channel];
                option.textContent = `${item.job} · NODE${item.node_id} · ${channel.toUpperCase()} · ${item.state}`;
                select.appendChild(option);
            });
        });
        if (previous && [...select.options].some(option => option.value === previous)) {
            select.value = previous;
        }
        workerIndexLoaded = true;
    }

    async function currentLogPath() {
        if (currentLog !== 'worker') return LOG_PATHS[currentLog];
        await loadWorkerIndex();
        const select = document.getElementById('workerLog');
        if (!select.value) throw new Error('No worker logs are available yet');
        return `tmp/logs/node_workers/${select.value}`;
    }
    
    function updateTimestamp() {
        const now = new Date();
        document.getElementById('lastUpdate').textContent = 
            `Last update: ${now.toLocaleTimeString()}`;
    }
    
    function isAtBottom(el) {
        return el.scrollTop + el.clientHeight >= el.scrollHeight - 10;
    }
    
    function scrollToBottom(el) {
        el.scrollTop = el.scrollHeight;
    }
    
    async function loadLog() {
        // Don't load if we're in the middle of switching tabs or user is selecting text
        if (isTabSwitching || isUserSelecting) {
            return;
        }
        
        try {
            // Avoid stale ASUS/browser cache without adding query strings that
            // can create noisy access-log variants.
            const response = await fetch(await currentLogPath(), { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const content = await response.text();
            
            const logContent = document.getElementById('logContent');
            const shouldScroll = autoScroll && isAtBottom(logContent);
            
            if (content !== lastContent) {
                logContent.textContent = content || '(Log file is empty)';
                lastContent = content;
                
                if (shouldScroll) {
                    scrollToBottom(logContent);
                }
                
                updateTimestamp();
            }
        } catch (error) {
            const logContent = document.getElementById('logContent');
            if (error.message.includes('No worker logs')) {
                logContent.textContent = 'No worker logs are available yet. Start a node synchronization to create them.';
            } else if (error.message.includes('404')) {
                logContent.textContent = 'Log file not found. The system may not be fully initialized.';
            } else {
                logContent.textContent = `Error loading log: ${error.message}`;
            }
            updateTimestamp();
        }
    }
    
    function refreshLogs() {
        loadLog();
    }
    
    function setupAutoRefresh() {
        if (refreshInterval) {
            clearInterval(refreshInterval);
        }
        
        // Don't setup refresh if user is selecting text
        if (isUserSelecting) {
            return;
        }
        
        const rate = parseInt(document.getElementById('refreshRate').value);
        refreshInterval = setInterval(loadLog, rate);
    }
    
    function pauseAutoRefresh() {
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
        document.getElementById('selectionStatus').style.display = 'inline';
    }
    
    function resumeAutoRefresh() {
        document.getElementById('selectionStatus').style.display = 'none';
        setupAutoRefresh();
    }
    
    function switchTab(logType) {
        if (logType === currentLog) return;
        
        isTabSwitching = true;
        currentLog = logType;
        document.getElementById('workerLog').style.display = logType === 'worker' ? 'block' : 'none';
        
        // Update tabs immediately for responsive UI
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelector(`.tab[data-log="${logType}"]`).classList.add('active');
        
        // Show loading message immediately
        const logContent = document.getElementById('logContent');
        logContent.textContent = 'Loading...';
        
        // Clear current content and load new log with a small delay to allow UI to update
        lastContent = '';
        
        // Use setTimeout to allow UI to update before fetching
        setTimeout(() => {
            isTabSwitching = false;
            loadLog();
        }, 50);
    }
    
    // Event listeners for text selection support
    function setupSelectionSupport() {
        const logContent = document.getElementById('logContent');
        
        logContent.addEventListener('mousedown', function() {
            // Set a short timeout - if mouse is still down after 100ms, assume selection
            mouseDownTimeout = setTimeout(() => {
                isUserSelecting = true;
                pauseAutoRefresh();
            }, 100);
        });
        
        logContent.addEventListener('mouseup', function() {
            // Clear the timeout if mouse is released quickly (click without selection)
            if (mouseDownTimeout) {
                clearTimeout(mouseDownTimeout);
                mouseDownTimeout = null;
            }
            
            // If user was selecting, wait a moment before resuming to allow for text copying
            if (isUserSelecting) {
                setTimeout(() => {
                    isUserSelecting = false;
                    resumeAutoRefresh();
                }, 2000); // Resume after 2 seconds of inactivity
            }
        });
        
        logContent.addEventListener('keydown', function(e) {
            // If user presses keys that might indicate text selection (Shift, Ctrl, Arrow keys)
            if (e.shiftKey || e.ctrlKey || e.key.includes('Arrow')) {
                isUserSelecting = true;
                pauseAutoRefresh();
            }
        });
        
        logContent.addEventListener('keyup', function() {
            if (isUserSelecting) {
                setTimeout(() => {
                    isUserSelecting = false;
                    resumeAutoRefresh();
                }, 2000);
            }
        });
        
        // Also resume when user clicks elsewhere
        document.addEventListener('mousedown', function(e) {
            if (!logContent.contains(e.target) && isUserSelecting) {
                isUserSelecting = false;
                resumeAutoRefresh();
            }
        });
    }
    
    // Event listeners
    document.getElementById('autoScroll').addEventListener('change', function() {
        autoScroll = this.checked;
    });
    
    document.getElementById('refreshRate').addEventListener('change', function() {
        setupAutoRefresh();
    });
    
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            switchTab(this.getAttribute('data-log'));
        });
    });

    document.getElementById('workerLog').addEventListener('change', function() {
        if (currentLog === 'worker') {
            lastContent = '';
            loadLog();
        }
    });
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        setupAutoRefresh();
        setupSelectionSupport();
        loadLog();
        
        // Make log content focusable for keyboard selection
        document.getElementById('logContent').setAttribute('tabindex', '0');
        
        // Clean up interval when window closes
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            if (mouseDownTimeout) {
                clearTimeout(mouseDownTimeout);
            }
        });
    });
  </script>
</body>
</html>
